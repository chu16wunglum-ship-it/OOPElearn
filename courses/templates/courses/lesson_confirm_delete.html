{% extends 'base.html' %}
{% block title %}ลบบทเรียน{% endblock %}
{% block content %}
<div class="card p-4" style="max-width:480px;margin:0 auto;">
  <h4 class="fw-bold mb-3 text-danger"><i class="bi bi-exclamation-triangle"></i> ยืนยันการลบบทเรียน</h4>
  <p>คุณต้องการลบบทเรียน <strong>{{ lesson.title }}</strong> ใช่หรือไม่? แบบทดสอบและผลคะแนนของบทเรียนนี้จะถูกลบด้วย</p>
  <form method="post" class="d-flex gap-2">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">ลบบทเรียน</button>
    <a href="{% url 'courses:course_detail' lesson.course.pk %}" class="btn btn-outline-secondary">ยกเลิก</a>
  </form>
</div>
{% endblock %}
