{% extends 'base.html' %}
{% block title %}ลบคำถาม{% endblock %}
{% block content %}
<div class="card p-4" style="max-width:480px;margin:0 auto;">
  <h4 class="fw-bold mb-3 text-danger"><i class="bi bi-exclamation-triangle"></i> ยืนยันการลบคำถาม</h4>
  <p>คุณต้องการลบคำถาม "<strong>{{ question.text }}</strong>" ใช่หรือไม่?</p>
  <form method="post" class="d-flex gap-2">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">ลบคำถาม</button>
    <a href="{% url 'exams:quiz_manage' question.quiz.lesson_id question.quiz.kind %}" class="btn btn-outline-secondary">ยกเลิก</a>
  </form>
</div>
{% endblock %}
