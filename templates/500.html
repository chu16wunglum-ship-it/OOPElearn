<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เกิดข้อผิดพลาด | OOPElearn</title>
<style>
  body {
    font-family: 'Segoe UI', 'Noto Sans Thai', system-ui, sans-serif;
    background: #f5f5fc;
    color: #16152a;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
  }
  .box {
    max-width: 480px;
    text-align: center;
    background: #fff;
    border-radius: 1.4rem;
    padding: 3rem 2.5rem;
    box-shadow: 0 20px 48px rgba(30,27,46,0.16);
  }
  .icon { font-size: 3rem; margin-bottom: 1rem; }
  h1 { font-size: 1.5rem; margin: 0 0 0.75rem; }
  p { color: #6b7280; margin: 0 0 1.5rem; }
  a {
    display: inline-block;
    background: linear-gradient(120deg, #4f46e5, #8b5cf6);
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    padding: 0.6rem 1.4rem;
    border-radius: 0.7rem;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="icon">⚠️</div>
    <h1>เกิดข้อผิดพลาดบางอย่าง</h1>
    <p>ระบบขัดข้องชั่วคราว กรุณาลองใหม่อีกครั้ง หากยังพบปัญหากรุณาแจ้งครูผู้ดูแลระบบ</p>
    <a href="/">กลับไปหน้าแรก</a>
  </div>
</body>
</html>
