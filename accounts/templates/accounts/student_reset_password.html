{% extends 'base.html' %}
{% block title %}ตั้งรหัสผ่านใหม่{% endblock %}
{% block content %}
<div class="card p-4" style="max-width:480px;margin:0 auto;">
  <h4 class="fw-bold mb-3"><i class="bi bi-key text-warning"></i> ตั้งรหัสผ่านใหม่</h4>
  <p>ตั้งรหัสผ่านใหม่แบบสุ่มให้ <strong>{{ student.first_name }} {{ student.last_name }}</strong> ({{ student.username }})?</p>
  <form method="post" class="d-flex gap-2">
    {% csrf_token %}
    <button type="submit" class="btn btn-warning">ตั้งรหัสผ่านใหม่</button>
    <a href="{% url 'accounts:student_list' %}" class="btn btn-outline-secondary">ยกเลิก</a>
  </form>
</div>
{% endblock %}
